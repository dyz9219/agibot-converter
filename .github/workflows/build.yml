name: Build Multi-Platform

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:  # Manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install "setuptools<81.0.0,>=71.0.0"
          python -m pip install "flet>=0.27,<1.0" "flet-desktop>=0.27,<1.0" "h5py>=3.10" "numpy>=1.26,<2" "opencv-python-headless>=4.9" "rosbags>=0.11" "ray>=2.9" "torch==2.2.2" "torchvision==0.17.2" "datasets==4.1.1" "huggingface-hub==0.35.1" "pyarrow==21.0.0" "jsonlines>=4.0" "pillow>=10.0" "accelerate>=1.10.0,<2.0.0" "av>=15.0.0,<16.0.0" "black>=24.0" "isort>=5.13" "mypy>=1.10" "ruff>=0.8" "pytest>=8.0" "pyinstaller>=6.0"
          python -m pip install --no-deps "lerobot==0.4.4"
          python -m pip install --no-deps -e ".[dev]"
      - name: Verify environment
        run: |
          python -m pip show pyinstaller
          python -c "import PyInstaller,sys; print('PyInstaller', PyInstaller.__version__, 'Python', sys.executable)"
      - name: Build full package
        run: |
          ./scripts/build_exe.ps1 -Profile full -Clean
      - name: Verify packaged any4
        run: |
          ./scripts/verify_packaged_any4.ps1 -DistRoot dist/DataConverterShell
      - name: Verify build fingerprint
        run: |
          ./scripts/verify_build_fingerprint.ps1 -ExePath dist/DataConverterShell/DataConverterShell.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataConverterShell-Windows
          path: dist/DataConverterShell/

  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install "setuptools<81.0.0,>=71.0.0"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.2.2" "torchvision==0.17.2"
          python -m pip install "flet>=0.27,<1.0" "flet-desktop>=0.27,<1.0" "h5py>=3.10" "numpy>=1.26,<2" "opencv-python-headless>=4.9" "rosbags>=0.11" "ray>=2.9" "datasets==4.1.1" "huggingface-hub==0.35.1" "pyarrow==21.0.0" "jsonlines>=4.0" "pillow>=10.0" "accelerate>=1.10.0,<2.0.0" "av>=15.0.0,<16.0.0" "black>=24.0" "isort>=5.13" "mypy>=1.10" "ruff>=0.8" "pytest>=8.0" "pyinstaller>=6.0"
          python -m pip install --no-deps "lerobot==0.4.4"
          python -m pip install --no-deps -e ".[dev]"
      - name: Verify PyInstaller
        run: |
          python -m pip show pyinstaller
          python -c "import PyInstaller,sys; print('PyInstaller', PyInstaller.__version__, 'Python', sys.executable)"
      - name: Generate build metadata
        run: |
          mkdir -p build/build-meta
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          dirty = bool(subprocess.check_output(["git", "status", "--porcelain"], text=True).strip())
          meta = {
              "profile": "linux-x64",
              "build_time": datetime.now(timezone.utc).isoformat(),
              "git_commit": commit,
              "git_dirty": dirty,
              "source_fingerprint": "linux-ci",
              "dirty_files": [],
          }
          with open("build/build-meta/build_meta.json", "w", encoding="utf-8") as f:
              json.dump(meta, f, ensure_ascii=False)
          PY
      - name: Build binary
        run: |
          EXTRA_ARGS=()
          if [ -d "$PWD/assets" ]; then
            EXTRA_ARGS+=(--add-data "$PWD/assets:assets")
          fi
          python -m PyInstaller --noconfirm --onefile --windowed --name DataConverterShell --distpath dist --workpath build --collect-all flet --collect-all flet_desktop --collect-all rosbags --collect-binaries torch --hidden-import torch --collect-all lerobot --collect-submodules ray --collect-binaries ray --collect-all psutil --collect-all ray.thirdparty_files.psutil --collect-submodules rosbags.typesys.stores --collect-data tkinter --hidden-import psutil._psutil_linux --hidden-import ray.thirdparty_files.psutil._psutil_linux --add-data "$PWD/any4lerobot:any4lerobot" --add-data "$PWD/build/build-meta/build_meta.json:assets" "${EXTRA_ARGS[@]}" src/data_converter/main.py
      - name: Make executable
        run: |
          chmod +x dist/DataConverterShell
      - name: Smoke test binary
        run: |
          ./dist/DataConverterShell --internal-build-info | tee /tmp/build-info.json
          ./dist/DataConverterShell --internal-run-rosbag-health --bag-type MCAP
          ./dist/DataConverterShell --internal-run-any4-health --version v3.0
          ./dist/DataConverterShell --internal-run-any4-health --version v2.1
          ./dist/DataConverterShell --internal-run-any4-health --version v2.0
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataConverterShell-Linux-x64
          path: dist/DataConverterShell

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm  # GitHub ARM runner
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
